name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Permisos requeridos para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite un solo despliegue concurrente, descartando los que estén en cola
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Instalar dependencias de Frontend
        working-directory: ./frontend
        run: npm ci

      - name: Compilar Angular para Producción
        working-directory: ./frontend
        run: npx ng build --configuration production --base-href /LMS_PRIMARIA/

      - name: Copiar 404.html y crear .nojekyll en el output
        run: |
          BUILD_DIR="./frontend/dist/lms-primaria/browser"
          if [ -d "$BUILD_DIR" ]; then
            cp ./frontend/public/404.html "$BUILD_DIR/404.html" || true
            touch "$BUILD_DIR/.nojekyll"
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist/lms-primaria/browser'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
