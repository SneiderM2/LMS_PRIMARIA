<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" filter="url(#glow)" />
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#bae6fd" stroke-width="2" />

  <!-- Atom Orbits -->
  <ellipse cx="64" cy="64" rx="42" ry="16" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.85" transform="rotate(-30 64 64)" />
  <ellipse cx="64" cy="64" rx="42" ry="16" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.85" transform="rotate(30 64 64)" />
  <ellipse cx="64" cy="64" rx="42" ry="16" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.65" transform="rotate(90 64 64)" />

  <!-- Electrons / Stars -->
  <circle cx="28" cy="44" r="5" fill="url(#accentGrad)" />
  <circle cx="100" cy="84" r="5" fill="url(#accentGrad)" />
  <circle cx="64" cy="22" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />

  <!-- Center Glowing Core / Open Book -->
  <circle cx="64" cy="64" r="14" fill="url(#accentGrad)" filter="url(#glow)" />
  <circle cx="64" cy="64" r="11" fill="#fef08a" />
  
  <!-- Mini Sparkle in Core -->
  <path d="M 64 56 L 66 62 L 72 64 L 66 66 L 64 72 L 62 66 L 56 64 L 62 62 Z" fill="#b45309" />
</svg>
