<div *ngIf="isOpen" class="modal-overlay" (click)="onCancel()" role="dialog" aria-modal="true" aria-labelledby="modal-change-password-title">
  <div class="modal-content glass-panel" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2 id="modal-change-password-title">
        <span>🔑</span> Cambiar mi contraseña
      </h2>
      <button type="button" class="btn-close" (click)="onCancel()" aria-label="Cerrar ventana">✕</button>
    </div>

    <div class="modal-body">
      <p class="modal-intro">
        Para mantener tu cuenta segura, crea una contraseña entre <strong>4 y 10 caracteres</strong> combinando mayúsculas, minúsculas, números y símbolos.
      </p>

      <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
        ⚠️ {{ errorMessage }}
      </div>

      <form (ngSubmit)="onSubmit()">
        <!-- Contraseña actual -->
        <div class="form-group">
          <label for="currentPasswordInput">Contraseña actual</label>
          <div class="input-with-toggle">
            <input
              id="currentPasswordInput"
              [type]="showCurrentPass ? 'text' : 'password'"
              [(ngModel)]="currentPassword"
              name="currentPassword"
              class="form-input"
              required
              autocomplete="current-password"
              placeholder="Ingresa tu contraseña actual" />
            <button
              type="button"
              class="btn-toggle-eye"
              (click)="showCurrentPass = !showCurrentPass"
              [attr.aria-label]="showCurrentPass ? 'Ocultar contraseña' : 'Ver contraseña'">
              {{ showCurrentPass ? '🙈' : '👁️' }}
            </button>
          </div>
        </div>

        <!-- Nueva contraseña -->
        <div class="form-group">
          <label for="newPasswordInput">Nueva contraseña (4 a 10 caracteres)</label>
          <div class="input-with-toggle">
            <input
              id="newPasswordInput"
              [type]="showNewPass ? 'text' : 'password'"
              [(ngModel)]="newPassword"
              name="newPassword"
              class="form-input"
              required
              minlength="4"
              maxlength="10"
              autocomplete="new-password"
              placeholder="Ej: Profe10&#64; o Ab1#" />
            <button
              type="button"
              class="btn-toggle-eye"
              (click)="showNewPass = !showNewPass"
              [attr.aria-label]="showNewPass ? 'Ocultar contraseña' : 'Ver contraseña'">
              {{ showNewPass ? '🙈' : '👁️' }}
            </button>
          </div>

          <!-- Medidor de política interactivo -->
          <app-password-policy-meter
            [password]="newPassword"
            [username]="currentUser?.id"
            [fullName]="currentUser?.fullName">
          </app-password-policy-meter>
        </div>

        <!-- Confirmar nueva contraseña -->
        <div class="form-group">
          <label for="confirmNewPasswordInput">Confirmar nueva contraseña</label>
          <div class="input-with-toggle">
            <input
              id="confirmNewPasswordInput"
              [type]="showConfirmPass ? 'text' : 'password'"
              [(ngModel)]="confirmNewPassword"
              name="confirmNewPassword"
              class="form-input"
              required
              minlength="4"
              maxlength="10"
              autocomplete="new-password"
              placeholder="Repite la nueva contraseña" />
            <button
              type="button"
              class="btn-toggle-eye"
              (click)="showConfirmPass = !showConfirmPass"
              [attr.aria-label]="showConfirmPass ? 'Ocultar contraseña' : 'Ver contraseña'">
              {{ showConfirmPass ? '🙈' : '👁️' }}
            </button>
          </div>

          <small *ngIf="confirmNewPassword && !passwordsMatch" class="mismatch-hint">
            ❌ Las contraseñas no coinciden.
          </small>
          <small *ngIf="confirmNewPassword && passwordsMatch && newPassword" class="match-hint">
            ✓ Las contraseñas coinciden.
          </small>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" (click)="onCancel()" [disabled]="isSubmitting">
            Cancelar
          </button>
          <button type="submit" class="btn btn-primary" [disabled]="!isFormValid || isSubmitting">
            {{ isSubmitting ? 'Guardando...' : 'Actualizar contraseña' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
