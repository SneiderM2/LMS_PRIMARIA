<div class="password-meter-wrap" [class.compact]="compact" aria-live="polite">
  <!-- Encabezado de fortaleza y contador de caracteres -->
  <div class="meter-header">
    <div class="strength-indicator">
      <span class="strength-dot" [style.background-color]="result.strengthColor"></span>
      <span class="strength-text" [style.color]="result.strengthColor">
        Fortaleza: <strong>{{ result.strengthLabel }}</strong>
      </span>
    </div>
    <div class="char-counter" [class.invalid]="result.length > 0 && !result.hasLength" [class.valid]="result.hasLength">
      <span>{{ result.length }} / 10</span>
      <small class="counter-label">(mín. 4)</small>
    </div>
  </div>

  <!-- Barra visual de progreso -->
  <div class="meter-bar-track" role="progressbar" [attr.aria-valuenow]="result.strengthScore" aria-valuemin="0" aria-valuemax="100">
    <div class="meter-bar-fill" [style.width.%]="result.strengthScore" [style.background-color]="result.strengthColor"></div>
  </div>

  <!-- Lista interactiva de verificación (Checklist) -->
  <ul *ngIf="showChecklist" class="checklist-items" role="list">
    <li *ngFor="let rule of result.rules" class="rule-item" [class.passed]="rule.passed">
      <span class="rule-icon" aria-hidden="true">{{ rule.passed ? '✓' : '○' }}</span>
      <span class="rule-label">{{ rule.label }}</span>
    </li>
  </ul>
</div>
