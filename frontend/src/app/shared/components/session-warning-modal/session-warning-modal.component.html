<div class="timeout-backdrop" *ngIf="visible" role="alertdialog" aria-modal="true" aria-labelledby="timeout-modal-title" aria-describedby="timeout-modal-desc">
  <div class="timeout-card animate-bounce-in">
    <div class="timeout-icon-circle" aria-hidden="true">
      <span class="sand-clock">⏳</span>
    </div>
    
    <h3 id="timeout-modal-title" class="timeout-title">{{ 'timeout.title' | translate }}</h3>
    <p id="timeout-modal-desc" class="timeout-subtitle">{{ 'timeout.subtitle' | translate }}</p>

    <div class="countdown-badge" role="timer" aria-live="polite" aria-atomic="true">
      <span class="clock-label">{{ 'timeout.clockLabel' | translate }}</span>
      <span class="clock-digits">{{ formattedTime }}</span>
    </div>

    <p class="timeout-help">{{ 'timeout.help' | translate }}</p>

    <div class="timeout-actions">
      <button type="button" class="btn-continue" (click)="onContinue()">
        {{ 'timeout.btnContinue' | translate }}
      </button>
    </div>
  </div>
</div>
