<button 
  type="button"
  class="theme-emoji-btn" 
  [class.dark-active]="themeService.isDarkMode()"
  (click)="toggle()"
  [attr.aria-label]="themeService.isDarkMode() ? ('theme.toLight' | translate) : ('theme.toDark' | translate)"
  [title]="themeService.isDarkMode() ? ('theme.toLight' | translate) : ('theme.toDark' | translate)">
  {{ themeService.isDarkMode() ? '🌙' : '☀️' }}
</button>
