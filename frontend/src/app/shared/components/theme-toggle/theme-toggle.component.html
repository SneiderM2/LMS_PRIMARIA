<button 
  type="button"
  class="theme-emoji-btn" 
  [class.dark-active]="themeService.isDarkMode()"
  (click)="toggle()"
  [attr.aria-label]="themeService.isDarkMode() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
  [title]="themeService.isDarkMode() ? 'Cambiar a Modo Claro ☀️' : 'Cambiar a Modo Oscuro 🌙'">
  {{ themeService.isDarkMode() ? '🌙' : '☀️' }}
</button>
