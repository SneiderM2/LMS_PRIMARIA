<!-- Banner Informativo de Cold Start (Render Free Tier) -->
<div *ngIf="serverStatus.isWakingUp()" class="cold-start-banner animate-fade-in" role="alert">
  <div class="cold-start-container">
    <div class="cold-start-icon">⏳</div>
    <div class="cold-start-info">
      <h4 class="cold-start-title">Iniciando servidor en la nube...</h4>
      <p class="cold-start-desc">{{ serverStatus.statusMessage() }}</p>
    </div>
    <button type="button" class="cold-start-close" (click)="serverStatus.setWakingUp(false)" aria-label="Cerrar aviso">×</button>
  </div>
</div>

<router-outlet></router-outlet>
<app-theme-toggle></app-theme-toggle>

<!-- Modal Obligatorio de Política de Tratamiento de Datos Personales (Sprint 4) -->
<app-data-policy-modal 
  [visible]="showPolicyModal" 
  (accepted)="onPolicyAccepted()">
</app-data-policy-modal>

<!-- Modal de Advertencia por Inactividad de Sesión (2.5 min aviso / 5 min cierre) -->
<app-session-warning-modal></app-session-warning-modal>
