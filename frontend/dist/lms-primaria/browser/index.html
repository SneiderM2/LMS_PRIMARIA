  <!-- Registro del Service Worker para PWA Offline -->
  <script>
    if ('serviceWorker' in navigator && (window.location.protocol.startsWith('http') || window.location.protocol.startsWith('https'))) {
      window.addEventListener('load', () => {
        const swUrl = 'service-worker.js';
        navigator.serviceWorker.register(swUrl)
          .then((registration) => {
            console.log('[PWA] Service Worker registrado exitosamente con alcance:', registration.scope);
          })
          .catch((error) => {
            console.warn('[PWA] Fallo al registrar el Service Worker:', error);
          });
      });
    }
  </script>
